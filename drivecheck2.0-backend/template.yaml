  # ---------- Real-time fan-out (AppSync) ----------
  # Minimal real-time slice for the Flutter home page: every change to
  # the Inspections table triggers a push to subscribed clients via
  # AppSync GraphQL subscriptions. Scope: just the Inspection entity
  # right now — steps / tickets / leads stay REST-only for the moment.
  #
  # Auth: API_KEY (hackathon-friendly). The mobile app embeds the
  # key + uses it for both connection-init and subscription auth.
  # Tighten to Cognito User Pools or IAM once we have real users.

  RealtimeApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub drivecheck-realtime-${Stage}
      AuthenticationType: API_KEY
      # Lambda → AppSync mutation calls authenticate with IAM (SigV4)
      # so the publisher doesn't need to know the rotating API key.
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_IAM
      Tags:
        - { Key: Owner, Value: !Ref OwnerTag }
        - { Key: Project, Value: drivecheck }

  RealtimeApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt RealtimeApi.ApiId
      Description: Client-facing key for the Flutter app's subscription
      # 1 year — rotate before expiry. Default is 7 days which is too short for a deploy cadence.
      Expires: 0  # 0 means default 7-day; bump to a real unix ts for longer

  RealtimeSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt RealtimeApi.ApiId
      Definition: |
        type Inspection {
          id: ID!
          assignedTo: String!
          status: String!
          completedStepCount: Int
          stepCount: Int
          carTitle: String
          customerName: String
          scheduledAt: String
          updatedAt: String
        }

        # publishInspectionChanged is the ONLY mutation, called by the
        # publisher Lambda via SigV4-signed IAM auth. Clients can't
        # call it (no @aws_api_key directive). Pass through input → fire
        # subscription.
        type Mutation {
          publishInspectionChanged(input: InspectionInput!): Inspection
            @aws_iam
        }

        input InspectionInput {
          id: ID!
          assignedTo: String!
          status: String!
          completedStepCount: Int
          stepCount: Int
          carTitle: String
          customerName: String
          scheduledAt: String
          updatedAt: String
        }

        # Clients subscribe by their own userId — AppSync filters
        # server-side so jockey A never sees jockey B's events.
        type Subscription {
          onInspectionsForJockey(assignedTo: String!): Inspection
            @aws_subscribe(mutations: ["publishInspectionChanged"])
            @aws_api_key
        }

        schema {
          query: Query
          mutation: Mutation
          subscription: Subscription
        }

        # AppSync requires a query type even if unused; clients only
        # subscribe + the publisher only mutates.
        type Query {
          _empty: String
        }

  # NONE-type data source — the mutation has no backend persistence,
  # it just exists to trigger the subscription.
  RealtimeNoneDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt RealtimeApi.ApiId
      Name: PublishNoOp
      Type: NONE

  # Resolver: pass the input straight through. AppSync calls this when
  # the publisher Lambda invokes the mutation; the return value
  # becomes the subscription payload.
  PublishInspectionResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: RealtimeSchema
    Properties:
      ApiId: !GetAtt RealtimeApi.ApiId
      TypeName: Mutation
      FieldName: publishInspectionChanged
      DataSourceName: !GetAtt RealtimeNoneDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "payload": $util.toJson($ctx.args.input)
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  # Publisher Lambda — subscribed to the Inspections DDB stream,
  # SigV4-signs a GraphQL mutation call on the AppSync HTTP endpoint
  # for every NEW_IMAGE the stream emits.
  PublishInspectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub drivecheck-realtime-publishInspection-${Stage}
      CodeUri: realtime/publishInspection/
      Handler: index.handler
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          APPSYNC_GRAPHQL_URL: !GetAtt RealtimeApi.GraphQLUrl
          APPSYNC_API_ARN: !GetAtt RealtimeApi.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: appsync:GraphQL
              Resource: !Sub "${RealtimeApi.Arn}/types/Mutation/fields/publishInspectionChanged"
      Events:
        InspectionsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt InspectionsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumRetryAttempts: 2
      Tags: { Owner: !Ref OwnerTag, Project: drivecheck }

Outputs:
  ApiBaseUrl:
    Description: Invoke URL for the DriveCheck API.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ApiKeyId:
    Description: API key id — fetch its value with `aws apigateway get-api-key --api-key <id> --include-value`.
    Value: !Ref ApiApiKey
  LambdaExecutionRoleArn:
    Description: Single execution role used by every Lambda — give this ARN to DevOps for SCP exemption.
    Value: !GetAtt LambdaExecutionRole.Arn
  InspectionsTableName:
    Value: !Ref InspectionsTable
  InspectionStepsTableName:
    Value: !Ref InspectionStepsTable
  InspectionTicketsTableName:
    Value: !Ref InspectionTicketsTable
  InspectionLeadsTableName:
    Value: !Ref InspectionLeadsTable
  UsersTableName:
    Value: !Ref UsersTable
  UserOtpTableName:
    Value: !Ref UserOtpTable
  UserSessionsTableName:
    Value: !Ref UserSessionsTable
  SelfiesBucketName:
    Value: !Ref SelfiesBucket
  SelfiesPublicBaseUrl:
    Value: !Sub "https://${SelfiesBucket}.s3.${AWS::Region}.amazonaws.com"
  OpenAiSecretArn:
    Value: !Ref OpenAiSecret
  RealtimeGraphQLUrl:
    Description: AppSync GraphQL endpoint — embed in the Flutter app for real-time inspection subscriptions.
    Value: !GetAtt RealtimeApi.GraphQLUrl
  RealtimeRealtimeUrl:
    Description: AppSync WebSocket endpoint (derived from GraphQLUrl host).
    Value: !Sub
      - wss://${Host}/graphql
      - { Host: !Select [2, !Split ["/", !GetAtt RealtimeApi.GraphQLUrl]] }
  RealtimeApiKey:
    Description: API key the Flutter app uses for subscription auth. Rotate via `aws appsync update-api-key`.
    Value: !GetAtt RealtimeApiKey.ApiKey
  AuthSecretArn:
    Value: !Ref AuthSecret
